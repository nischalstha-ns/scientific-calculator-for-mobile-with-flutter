name: scientific_calculator
description: Next-Gen Scientific Calculator
publish_to: 'none'
version: 1.4.2+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  math_expressions: ^2.4.0
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/fonts/logo/logo.jpeg"
  adaptive_icon_background: "#2d2d2d"
  adaptive_icon_foreground: "assets/fonts/logo/logo.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/logo/logo.jpeg
    - assets/sounds/
